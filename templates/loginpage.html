<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        
        <title>
            {% block title %}
            Login page - myfilesOnline
            {% endblock %}
        </title>
        
        <meta name="description" content="A cloud file manager">    
    </head>

    <body>
        
        <header>
            
            <h1>
                {% block head_title %}
                Log in
                {% endblock %}
            </h1>
            
        </header>
        

        <main>
            <section>
                <form>
                    <label for="username">Username:</label><br>
                    <input type="text" id="username" name="username"><br>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email"><br>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password"><br>
                    {%block repeat_password %}
                    {% endblock %}
                    

                </form>


            </section>
        </main>

    </body>

</html>
